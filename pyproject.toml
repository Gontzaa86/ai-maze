[project]
name = "ai-maze"
version = "0.1.0"
description = ""
authors = [
    {name = "Gontzaa86",email = "gonzalohernandezidigoras@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "pygame (>=2.6.1,<3.0.0)"
]

[tool.poetry]
packages = [
    { include = "dataset" },
    { include = "generators" },
    { include = "solvers" },
    { include = "maze" },
    { include = "benchmark" },
    { include = "visualization" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dataset = "dataset.run:main"